[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xml-digest-backend"
version = "1.0.0"
description = "Exclusive-C14N-1.0 based digest backend for research XML selections"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "XML Digest Backend" }]
dependencies = []

[project.optional-dependencies]
# Used only by the differential/property test suite as an independent
# canonicalization oracle; the runtime itself needs no third-party code.
test = ["lxml>=4.9"]

[project.scripts]
xml-digest = "xml_digest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
